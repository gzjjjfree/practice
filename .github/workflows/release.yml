  create-release:
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Organize and Rename Assets
        run: |
          # 1. 准备发布目录
          mkdir -p release_assets

          # 2. 处理 Docker 版 (通用版 23MB)
          # 我们给它一个非常明确的名字
          # cp docker-build-apk/Practice.apk release_assets/Practice_docker.apk

          # 3. 处理 Native 版 (精简版 10MB)
          # 如果你依然想保留它作为备选
          cp android-apk/Practice_Native.apk release_assets/Practice.apk
          cp android-apk/Practice_Native.aab release_assets/Practice.aab

          # 4. 处理 macOS 版
          cp macos-app/*.zip release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
